name: CI

# Gabarit pose par ci_pilot.py sur les depots node sans workflow.
#
# Quatre defauts mesures le 2026-07-28 sur les 7 candidats node, et corriges ici.
# Les quatre produisaient le meme effet que leurs cousins du gabarit .NET : un
# vert qui ne dit rien du depot.
#
#  1. `npm ci` etait lance A LA RACINE. Or seuls 3 des 7 candidats ont un
#     package.json a la racine : webassembly-demo (client/ + server/),
#     agent-skills-backup, garry-brain et garry-workspace n'en ont pas. Le
#     gabarit precedent rendait donc ROUGE 4 depots sur 7 pour une raison
#     etrangere a leur code. Ici on DECOUVRE les paquets, comme le gabarit .NET
#     decouvre les solutions.
#
#  2. `npm ci || npm install` masquait l'absence de lockfile. `npm ci` EXIGE un
#     package-lock.json en phase avec le package.json ; sans lui la commande
#     echoue et le `||` retombe sur `npm install`, QUI REGENERE L'ARBRE. Le vert
#     obtenu ne vaut alors que pour les versions du jour. C'est exactement ce qui
#     rend la vague openjam-monorepo injugeable (lockfileVersion 1 desynchronise,
#     arbre regenere incoherent, suite de tests qui ne demarre pas). 3 des 7
#     candidats n'ont aucun lockfile : le cas n'est pas theorique. Le fallback
#     existe toujours — sinon ces 3 depots n'auraient jamais de CI — mais il est
#     ANNONCE, jamais silencieux.
#
#  3. `--if-present` sur les DEUX etapes rend vert un depot qui ne declare ni
#     `build` ni `test`. `garry-brain` est exactement dans ce cas : le gabarit
#     precedent lui aurait pose un badge pour n'avoir rien execute. Ici, un depot
#     dont AUCUN paquet ne declare l'un des deux echoue franchement.
#
#  4. `node-version: "20"` etait epingle et a pourri : le poste de dev est en
#     node 26. Une version epinglee sort de support en silence. `lts/*` suit le
#     LTS courant — moins reproductible, mais une CI qui tourne sur un node hors
#     support ne prouve rien non plus. Compromis assume, ecrit ici pour que le
#     prochain ne le defasse pas sans savoir pourquoi.
#
# Ce gabarit est plus severe que le precedent. Le flux de ci_pilot ne merge que
# les PR vertes, donc un depot nouvellement severe reste en backlog au lieu de
# recevoir un badge qui ment.

on:
  push:
    branches: ["dev"]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    # Un `npm test` en mode watch ne rend JAMAIS la main : sans cette garde le
    # job tourne jusqu'au plafond GitHub de 6 heures. Observe en mesurant les
    # candidats — l'oracle a du couper un `npm test` a son propre delai. Le
    # quota Actions de l'org Atypical est deja epuise : une seule vague de jobs
    # bloques le viderait pour le mois.
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: "lts/*"

      - name: Decouvrir les paquets
        shell: bash
        run: |
          set -uo pipefail
          # `sort` n'est pas cosmetique : sans lui l'ordre vient du systeme de
          # fichiers et differe entre runners. Meme defaut que celui mesure cote
          # .NET sur G3.TreasuresMonsters, ou ubuntu et macOS ne prenaient pas la
          # meme cible.
          #
          # Pas de `mapfile` : il n'existe pas avant bash 4, et le poste de dev
          # est en bash 3.2. Une logique qu'on ne peut pas rejouer hors CI n'a
          # pas de test.
          CIBLES="$RUNNER_TEMP/ci_packages.txt"
          find . -name package.json -not -path '*/node_modules/*' | sort > "$CIBLES.all"
          if [ -f ./package.json ]; then
            # Un package.json a la racine EST le point d'entree du depot
            # (workspaces npm, ou projet simple) : npm gere ses sous-paquets.
            echo "./package.json" > "$CIBLES"
            AUTRES=$(grep -v '^\./package\.json$' "$CIBLES.all" || true)
            if [ -n "$AUTRES" ]; then
              # Un paquet non couvert est NOMME, jamais tu.
              echo "::notice::Racine prise comme point d'entree. Paquets NON couverts :"
              echo "$AUTRES" | sed 's/^/  /'
            fi
          else
            cp "$CIBLES.all" "$CIBLES"
          fi
          if [ ! -s "$CIBLES" ]; then
            echo "::error::Aucun package.json hors node_modules."
            exit 1
          fi
          echo "$(wc -l < "$CIBLES" | tr -d ' ') paquet(s) :"
          sed 's/^/  /' "$CIBLES"

      - name: Installer, construire, tester chaque paquet
        shell: bash
        run: |
          set -uo pipefail
          # `node -e` plutot que `jq` : node vient d'etre installe, donc il est
          # garanti present ; jq ne l'est pas sur tous les runners.
          a_script() {
            node -e "const p=require('path').resolve(process.argv[1],'package.json');
                     const s=(require(p).scripts)||{};
                     process.exit(s[process.argv[2]]?0:1)" "$1" "$2" 2>/dev/null
          }
          FAILED=()
          UTILE=0
          while read -r pkg; do
            d=$(dirname "$pkg")
            echo "::group::$d"
            if [ -f "$d/package-lock.json" ]; then
              (cd "$d" && npm ci) || FAILED+=("$d:install")
            else
              echo "::warning::$d n'a pas de package-lock.json. L'arbre est RESOLU AU MOMENT DU RUN : ce verdict n'est pas reproductible, et un vert d'aujourd'hui ne dit rien de demain. Committer un lockfile."
              (cd "$d" && npm install) || FAILED+=("$d:install")
            fi
            A_BUILD=0
            A_TEST=0
            a_script "$d" build && A_BUILD=1
            a_script "$d" test && A_TEST=1
            if [ "$A_BUILD" -eq 0 ] && [ "$A_TEST" -eq 0 ]; then
              echo "::notice::$d ne declare ni build ni test — rien a verifier dans ce paquet."
            fi
            [ "$A_BUILD" -eq 1 ] && { UTILE=1; (cd "$d" && npm run build) || FAILED+=("$d:build"); }
            [ "$A_TEST" -eq 1 ] && { UTILE=1; (cd "$d" && npm test) || FAILED+=("$d:test"); }
            echo "::endgroup::"
          done < "$RUNNER_TEMP/ci_packages.txt"
          if [ "$UTILE" -eq 0 ]; then
            echo "::error::Aucun paquet ne declare build ni test : cette CI ne verifierait rien. Un vert ici serait un badge sans mesure."
            exit 1
          fi
          if [ ${#FAILED[@]} -gt 0 ]; then
            echo "::error::${#FAILED[@]} etape(s) en echec : ${FAILED[*]}"
            exit 1
          fi
          echo "Tous les paquets passent."
